name: Verify OrderKey
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: toolchain
        shell: python
        run: |
          import json, os
          with open('toolchain.json') as f: pin=json.load(f)['version']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('version='+pin+'\n')
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: ${{ steps.toolchain.outputs.version }}
          core-version: ${{ steps.toolchain.outputs.version }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: moon version --all
      - run: moon update
      - run: python scripts/acceptance.py
      - run: moon package --list
      - run: python scripts/package.py --candidate
      - uses: actions/upload-artifact@v4
        with:
          name: orderkey-${{ runner.os }}-x64-candidate
          path: _build/distribution/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: _build/acceptance/*.json
